<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sales Dashboard - Franco's Portuguese Restaurant</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #d90000 50%, #00994d 50%);
            min-height: 100vh;
            color: white;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            min-height: 95vh;
        }

        header {
            background: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #ff6600;
            border-radius: 15px 15px 0 0;
            margin-bottom: 30px;
        }

        header h1 {
            color: #ff6600;
            margin: 0;
            font-size: 40px;
        }

        .nav-links {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #ff6600;
            text-decoration: none;
            font-size: 16px;
            padding: 5px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #333;
            text-decoration: underline;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: #222;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.2);
        }

        .dashboard-card h3 {
            color: #888;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .dashboard-card .value {
            color: #ff6600;
            font-size: 36px;
            font-weight: bold;
        }

        .dashboard-card .sub-value {
            color: #ccc;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="content-wrapper">
        <header>
            <h1>Sales Dashboard</h1>
            <p style="color:#ccc;">"Good food takes time"</p>
            
            <div class="nav-links">
                <a href="/">🏠 Home</a>
                <a href="/menu">📋 Menu</a>
                <a href="/specials">🔥 Specials</a>
                <a href="/cart">🛒 Cart</a>
                <a href="/orders">📦 Orders</a>
                <a href="/dashboard">📊 Dashboard</a>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Daily Sales -->
            <div class="dashboard-card">
                <h3>📅 Today's Sales</h3>
                <div class="value" th:text="'R' + ${dailySales}">R0</div>
                <div class="sub-value" th:text="${dailyOrders} + ' orders'">0 orders</div>
            </div>

            <!-- Weekly Sales -->
            <div class="dashboard-card">
                <h3>📈 This Week</h3>
                <div class="value" th:text="'R' + ${weeklySales}">R0</div>
                <div class="sub-value" th:text="${weeklyOrders} + ' orders'">0 orders</div>
            </div>

            <!-- Monthly Sales -->
            <div class="dashboard-card">
                <h3>📊 This Month</h3>
                <div class="value" th:text="'R' + ${monthlySales}">R0</div>
                <div class="sub-value" th:text="${monthlyOrders} + ' orders'">0 orders</div>
            </div>

            <!-- Total Sales -->
            <div class="dashboard-card">
                <h3>💰 Total Sales</h3>
                <div class="value" th:text="'R' + ${totalSales}">R0</div>
                <div class="sub-value" th:text="${totalOrders} + ' orders'">0 orders</div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px; color: #888; font-size: 14px;">
            <p>💡 Data is pulled directly from the database. Orders are kept permanently for reporting.</p>
        </div>
    </div>

</body>
</html>
