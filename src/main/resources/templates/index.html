<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Franco's Portuguese Restaurant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Red and Green Split Background */
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .left-red {
            width: 50%;
            height: 100%;
            background-color: #d90000;
            position: relative;
        }

        .right-green {
            width: 50%;
            height: 100%;
            background-color: #00994d;
            position: relative;
        }

        /* Center Content Overlay */
        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 80%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #fff;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* ====== NEW LOGO CONTAINER (Same size as old circle) ====== */
        .logo-container {
            width: 250px;
            height: 250px;
            margin: 0 auto 25px auto;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        @media (max-width: 768px){
            .logo-container{
                width: 160px;
                height: 160px;
                margin: 0 auto 15px auto;
            }
        }
        /* Catchy Title */
        .brand-title {
            font-family: 'Forte','Cooper Black', 'Arial Black', sans-serif;
            font-size: 52px;
            font-weight: 900;
            color: #ff6600;
            text-shadow: 3px 3px 0 #000, 0 0 20px rgba(255, 102, 0, 0.3);
            letter-spacing: 3px;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .brand-subtitle {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 18px;
            font-style: italic;
            font-weight: bold;
            color: white;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 20px;
        }

        /* Opening Hours */
        .opening-hours {
            margin: 10px 0 20px 0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }

        .opening-hours p {
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #ffcc00;
            font-size: 16px;
            margin: 5px 0;
            line-height: 1.6;
            text-shadow: 1px 1px 0 #000;
        }

        /* ====== BUTTONS (Exactly Same Size) ====== */
        .button-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 15px 0;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
            border: 2px solid #fff;
            width: 200px;  /* ← EXACT SAME WIDTH */
            text-align: center;
        }

        .btn-orders {
            background: #00994d;
            box-shadow: 0 0 15px rgba(0, 153, 77, 0.5);
        }

        .btn-orders:hover {
            transform: scale(1.05);
            background: #007a3d;
            box-shadow: 0 0 25px rgba(0, 153, 77, 0.8);
        }

        .btn-menu {
            background: #ff6600;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
        }

        .btn-menu:hover {
            transform: scale(1.05);
            background: #e65c00;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.8);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .left-red, .right-green {
                width: 100%;
                height: 50%;
            }
            .center-content {
                width: 90%;
                padding: 20px;
            }
            .brand-title {
                font-size: 32px;
            }
            .logo-container {
                width: 140px;
                height: 140px;
            }
            .btn {
                width: 160px;
                padding: 12px 0;
                font-size: 16px;
            }
        }
    </style>
</head>
