<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Specials - Franco's Portuguese Restaurant</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #d90000 50%, #00994d 50%);
            min-height: 100vh;
            color: white;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            min-height: 95vh;
        }

        header {
            background: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #ff6600;
            border-radius: 15px 15px 0 0;
            margin-bottom: 30px;
        }

        header h1 {
            color: #ff6600;
            margin: 0;
            font-size: 40px;
        }

        .cart-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6600;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            z-index: 100;
            border: 2px solid white;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.6);
        }

        .cart-indicator a {
            color: white;
            text-decoration: none;
        }

        .specials-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .special-card {
            background: #222;
            width: 320px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.2);
            transition: 0.3s;
        }

        .special-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
        }

        .special-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        .price {
            color: #ff6600;
            font-size: 24px;
            font-weight: bold;
            display: block;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff6600;
            border: none;
            color: white;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #e65c00;
        }
    </style>
</head>

<body>

    <div class="cart-indicator">
        <a href="/cart">🛒 Cart (<span th:text="${cartCount}">0</span>)</a>
    </div>

    <div class="content-wrapper">
        <header>
            <h1>Today's Specials</h1>
            <p style="color:#ccc;">"Good food takes time"</p>
        </header>

        <div class="specials-container">
            <div class="special-card">
                <img src="/images/peri-peri-chicken.jpg" alt="Peri Peri Chicken">
                <div class="content">
                    <h2>Full Chicken Special</h2>
                    <p>Full flame grilled chicken + chips.</p>
                    <span class="price">R199</span>
                    <form th:action="@{/addToCart}" method="post">
                        <input type="hidden" name="itemName" value="Full Chicken Special" />
                        <input type="hidden" name="itemPrice" value="199.00" />
                        <button type="submit">Add To Cart</button>
                    </form>
                </div>
            </div>

            <div class="special-card">
                <img src="/images/prawns.jpg" alt="Prawn Combo">
                <div class="content">
                    <h2>Prawn Combo</h2>
                    <p>12 prawns with rice and sauce.</p>
                    <span class="price">R249</span>
                    <form th:action="@{/addToCart}" method="post">
                        <input type="hidden" name="itemName" value="Prawn Combo" />
                        <input type="hidden" name="itemPrice" value="249.00" />
                        <button type="submit">Add To Cart</button>
                    </form>
                </div>
            </div>

            <div class="special-card">
                <img src="/images/ribs.jpg" alt="Rib Special">
                <div class="content">
                    <h2>Rib &amp; Chicken Combo</h2>
                    <p>400g ribs + half chicken with chips.</p>
                    <span class="price">R280</span>
                    <form th:action="@{/addToCart}" method="post">
                        <input type="hidden" name="itemName" value="Rib & Chicken Combo" />
                        <input type="hidden" name="itemPrice" value="280.00" />
                        <button type="submit">Add To Cart</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
